<html>
    <head>
        <title>Forms</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <meta property="og:title" content="Forms">
        <meta property="og:description" content="A simple form example">
        <meta property="og:image" content="https://images.pexels.com/photos/8654775/pexels-photo-8654775.jpeg">
        <meta property="og:url" content="https://example.com/forms.html">

    </head>

    <body>

        <h3>first form</h3>

        <form>
            <label for="name">Name:</label><br>
            <input type="text"  id="name" >
            <br><br>
             <label for="age">Age:</label><br>
            <input type="number"  id="age">
            <br><br>
            <button>Submit</button>
        </form>

        <h3>forma za registraciju</h3>
        <form>
            <label for="username">Username:</label><br>
            <input type="text"  id="username" required>
            <br><br>
             <label for="email">Email:</label><br>
            <input type="email"  id="email" required>
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password"  id="password" required>
            <br><br>
            <h4>Odaberi Spol:</h4>
            
            <input type="radio" name="gender"id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <br><br>
            <h4>Odaberi jezik:</h4>
            <input type="checkbox" id="css" name="language">
            <label for="css">CSS</label>
            <br>
            <input type="checkbox" id="html" name="language">
            <label for="html">HTML</label>
            <br>
            <input type="checkbox" id="javascript" name="language">
            <label for="javascript">JavaScript</label>
            <br><br>

            <h4>Odaberi grad:</h4>
            <select id="city" name="city">
                <option>Sarajevo</option>
                <option>Mostar</option>
                <option>Banja Luka</option>
                <option>Tuzla</option>
            </select>
            <br><br>
            <label for="message">Message:</label><br>
            <textarea id="message"  rows="4" cols="50"></textarea>

            <br><br>



            <button>Submit</button>
        </form>

        <picture>
            <source srcset="https://images.pexels.com/photos/8654775/pexels-photo-8654775.jpeg" media="(max-width: 650px)">
            <img src="https://images.pexels.com/photos/7979405/pexels-photo-7979405.jpeg" 
alt="Slika" width="600" height="400">
        </picture>

    </body>
</html>
